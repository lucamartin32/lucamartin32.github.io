name: Actualizar stock

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "robot/**"
      - ".github/workflows/stock.yml"

permissions:
  contents: write

concurrency:
  group: stock
  cancel-in-progress: false

jobs:
  stock:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3 cryptography==44.0.0
      - name: Actualizar stock
        env:
          KEY: ${{ secrets.KEY }}
        run: python robot/run.py
      - name: Guardar catálogo
        run: |
          git config user.name "robot-stock"
          git config user.email "robot-stock@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Stock actualizado $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
      - name: Avisar si alguna tienda falló
        run: python robot/check.py
